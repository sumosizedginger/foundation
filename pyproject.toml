[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-foundation"
version = "0.0.1"
description = "Open, auditable economic measurement focused on the bottom 30%."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "openpyxl>=3.1,<4",
  "PyYAML>=6.0,<7",
  "requests>=2.32,<3",
  "xlrd>=2.0.1,<3",
  "pypdf>=5.0,<7",
  "cryptography>=43,<47",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=6,<7",
  "ruff>=0.9,<1",
]

[project.scripts]
foundation = "foundation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
  "integration: marks tests as requiring real Census/BLS external archives (deselect with '-m \"not integration\"')",
]

[tool.ruff]
line-length = 100
target-version = "py312"
