indicators:
  bottom30_cutoff:
    label: "Bottom-30 per-person household money-income cutoff"
    role: "anchor"
    source: "census_asec"
    status: "enabled"
    frequency: "annual"
    population_match: "canonical"
    direction: "not_scored"
    composite_weight: 0
    note: "Official CPS ASEC microdata weighted 30th percentile per person."

  survival_floor:
    label: "Single-Adult Basic Living Survival Floor"
    role: "survival_floor"
    source: "hud_usda_bls_eia_meps"
    status: "research_estimate"
    frequency: "annual"
    population_match: "independent_single_adult"
    direction: "not_scored"
    composite_weight: 0
    note: "Research estimate synthesized from official government baselines (HUD FMR, USDA TFP, EIA, BLS CE, MEPS)."

  u6:
