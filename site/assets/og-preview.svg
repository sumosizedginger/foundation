<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="0%" r="80%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#07090b"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bgGlow)"/>
  <rect x="80" y="80" width="1040" height="470" rx="24" fill="#0e1216" stroke="#242e38" stroke-width="2"/>
  
  <text x="140" y="170" font-family="-apple-system, system-ui, sans-serif" font-size="20" font-weight="800" fill="#f59e0b" letter-spacing="4">ECONOMIC RESEARCH INSTRUMENT</text>
  <text x="140" y="245" font-family="-apple-system, system-ui, sans-serif" font-size="54" font-weight="900" fill="#f0f4f8" letter-spacing="-1.5">THE FOUNDATION</text>
  <text x="140" y="315" font-family="-apple-system, system-ui, sans-serif" font-size="28" font-weight="500" fill="#94a3b8">How are the bottom 30% of Americans actually doing?</text>
  
  <!-- Stat 1 -->
  <rect x="140" y="370" width="430" height="120" rx="16" fill="#141a20" stroke="#242e38" stroke-width="1.5"/>
  <text x="170" y="410" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="800" fill="#94a3b8">POPULATION ANCHOR (2024)</text>
  <text x="170" y="460" font-family="Courier, monospace" font-size="38" font-weight="900" fill="#f59e0b">$21,800 / person</text>
  
  <!-- Stat 2 -->
  <rect x="610" y="370" width="450" height="120" rx="16" fill="#141a20" stroke="#242e38" stroke-width="1.5"/>
  <text x="640" y="410" font-family="-apple-system, system-ui, sans-serif" font-size="15" font-weight="800" fill="#94a3b8">SINGLE-ADULT SURVIVAL FLOOR</text>
  <text x="640" y="460" font-family="Courier, monospace" font-size="38" font-weight="900" fill="#38bdf8">$27,960 / year</text>
</svg>
