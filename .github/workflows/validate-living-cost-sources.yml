name: Validate Living Cost Sources

on:
  push:
    paths:
      - 'src/foundation/sources/**'
      - 'scripts/validate_living_cost_sources.py'
  pull_request:
    paths:
      - 'src/foundation/sources/**'
      - 'scripts/validate_living_cost_sources.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Source Artifacts & Provenance
        run: |
          python scripts/validate_living_cost_sources.py

      - name: Upload Source Manifest & Geo-Join Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: living-cost-source-validation
          path: data/metadata/
