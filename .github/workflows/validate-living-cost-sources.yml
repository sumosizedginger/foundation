name: Validate Living Cost Sources

on:
  push:
    branches: [main]
    paths:
      - "src/foundation/sources/**"
      - "src/foundation/living_cost/**"
      - "scripts/validate_living_cost_sources.py"
      - ".github/workflows/validate-living-cost-sources.yml"
  pull_request:
    paths:
      - "src/foundation/sources/**"
      - "src/foundation/living_cost/**"
      - "scripts/validate_living_cost_sources.py"
      - ".github/workflows/validate-living-cost-sources.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "npm"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate Source Artifacts & Provenance
        env:
          CENSUS_API_KEY: ${{ secrets.CENSUS_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          HUD_API_TOKEN: ${{ secrets.HUD_API_TOKEN }}
        run: |
          python scripts/validate_living_cost_sources.py

      - name: Upload Source Manifest & Geo-Join Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: living-cost-source-validation
          path: data/metadata/
