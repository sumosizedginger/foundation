name: Scheduled Economic Data Update

on:
  schedule:
    # Run every Wednesday morning at 12:00 UTC (post BLS / Census regular release windows)
    - cron: "0 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "data-update"
  cancel-in-progress: false

jobs:
  update-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Full Foundation Pipeline Update
        run: |
          python scripts/update_foundation.py
          pytest -m "not integration"
          python scripts/build_site.py
          python scripts/verify_repo.py

      - name: Commit and Push Verified Updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ site/data/
          if git diff --staged --quiet; then
            echo "No data changes detected."
          else
            git commit -m "chore(data): automated deterministic pipeline update"
            git push origin main
          fi
