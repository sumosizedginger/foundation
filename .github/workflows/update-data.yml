name: Update Foundation Data

on:
  workflow_dispatch:
    inputs:
      survey_year:
        description: "CPS ASEC survey year"
        required: true
        default: "2025"
      income_year:
        description: "Income reference year"
        required: true
        default: "2024"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Validate before update
        run: |
          foundation validate
          pytest

      - name: Update Bottom-30 population anchor
        run: |
          foundation bottom30 \
            --survey-year "${{ inputs.survey_year }}" \
            --income-year "${{ inputs.income_year }}"

      - name: Build site
        run: python scripts/build_site.py

      - name: Validate after update
        run: pytest

      - name: Commit changed validated data
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git config user.name "foundation-data-bot"
          git config user.email "foundation-data-bot@users.noreply.github.com"
          git add data/current site/data
          git commit -m "data: update Foundation population anchor"
          git push
